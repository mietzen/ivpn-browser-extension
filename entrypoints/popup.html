<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IVPN Proxy-Switcher</title>
    <link rel="stylesheet" href="~/entrypoints/popup/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <span class="brand-mark">IVPN Proxy-Switcher</span>
        <button id="open-options" class="open-options-btn" type="button">Settings</button>
      </header>

      <section class="status" id="status-panel" data-state="checking">
        <div class="status-headline" id="status-headline">Checking…</div>
        <div class="status-detail">
          <span id="status-ip-row" hidden><span id="status-ip"></span></span>
          <span class="status-sep" id="status-sep" hidden>·</span>
          <span id="status-loc-row" hidden><span id="status-loc"></span></span>
          <span class="status-sep" id="status-sep2" hidden>·</span>
          <span id="status-tunnel-row" hidden><span id="status-tunnel"></span></span>
        </div>
        <button id="status-refresh" class="text-btn" type="button">Refresh</button>
      </section>

      <section class="proxy-section">
        <h2 class="section-label">Global</h2>
        <div id="global-combobox"></div>
      </section>

      <section class="proxy-section" id="current-site-section">
        <h2 class="section-label">Current Website <span id="current-host" class="host-label"></span></h2>
        <div id="current-site-combobox"></div>
      </section>

      <footer class="app-footer">
        <p class="disclosure">
          Not affiliated with IVPN Limited. Talks directly to
          <code>api.ivpn.net</code>; no data passes through project maintainers.
        </p>
      </footer>
    </div>

    <script type="module" src="~/entrypoints/popup/main.ts"></script>
  </body>
</html>
