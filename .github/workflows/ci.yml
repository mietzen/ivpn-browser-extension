name: CI

on:
  pull_request:
    branches:
      - 'main'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install mise
        run: curl -fsSL https://mise.run | sh

      - name: Install Node
        run: mise install

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: .npm-cache
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Lint
        run: mise run lint

      - name: Compile
        run: mise run compile

      - name: Test
        run: mise run test

      - name: Build (Chrome)
        run: mise run build-chrome

      - name: Build (Firefox)
        run: mise run build-firefox

      - name: Package (Chrome)
        run: |
          cd .output/chrome-mv3
          zip -r ../../ivpn-companion-community-chrome-${{ github.sha }}.zip .

      - name: Package (Firefox)
        run: |
          cd .output/firefox-mv3
          zip -r ../../ivpn-companion-community-firefox-${{ github.sha }}.zip .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-builds
          path: |
            ivpn-companion-community-chrome-${{ github.sha }}.zip
            ivpn-companion-community-firefox-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 14
