name: CI

on:
  pull_request:
    branches:
      - 'main'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install mise
        run: curl -fsSL https://mise.run | sh

      - name: Install Node
        run: mise install

      - name: Install dependencies
        run: mise exec -- npm ci

      - name: Lint
        run: mise exec -- npm run lint

      - name: Compile
        run: mise exec -- npm run compile

      - name: Test
        run: mise exec -- npm test

      - name: Build (Chrome)
        run: mise exec -- npm run build:chrome

      - name: Build (Firefox)
        run: mise exec -- npm run build:firefox

      - name: Package (Chrome)
        run: |
          cd .output/chrome-mv3
          zip -r ../../ivpn-companion-community-chrome-${{ github.sha }}.zip .

      - name: Package (Firefox)
        run: |
          cd .output/firefox-mv3
          zip -r ../../ivpn-companion-community-firefox-${{ github.sha }}.zip .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-builds
          path: |
            ivpn-companion-community-chrome-${{ github.sha }}.zip
            ivpn-companion-community-firefox-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 14
