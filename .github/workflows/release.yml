name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  Setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Get Version
        id: set-version
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if grep -c -E '^v[[:digit:]]{1,3}\.[[:digit:]]{1,3}\.[[:digit:]]{1,3}$' <<< ${VERSION}; then
            VERSION=$(sed 's/^.\{1\}//g' <<< ${VERSION})
          else
            echo "This tag shouldn't be built: ${VERSION}"
            exit 1
          fi
          echo "version=$(echo ${VERSION})" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.browser }}
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v7

      - name: Install mise
        run: curl -fsSL https://mise.run | sh

      - name: Install Node
        run: mise install

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: .npm-cache
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Inject version from tag into package.json
        run: |
          VERSION="${{ needs.setup.outputs.version }}"
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json
          echo "package.json version set to $(jq -r .version package.json)"

      - name: Build (${{ matrix.browser }})
        run: mise run build-${{ matrix.browser }}

      - name: Package (${{ matrix.browser }})
        run: |
          cd .output/${{ matrix.browser }}-mv3
          zip -r ../../ivpn-companion-community-${{ matrix.browser }}-${{ needs.setup.outputs.version }}.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: extension-${{ matrix.browser }}
          path: ivpn-companion-community-${{ matrix.browser }}-${{ needs.setup.outputs.version }}.zip
          retention-days: 7

  release:
    name: Attach Artifacts to release
    runs-on: ubuntu-latest
    needs: [setup, build]
    steps:
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.setup.outputs.version }}"
          TAG="v${VERSION}"
          # Idempotent: upload assets if the release exists, otherwise
          # create it. This supports both flows:
          #   1. Create the release in the web UI (draft or published) and
          #      let the workflow attach the built artifacts.
          #   2. Push the tag and let the workflow create the release with
          #      assets in one shot.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists — uploading assets with --clobber."
            gh release upload "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              "dist/ivpn-companion-community-chrome-${VERSION}.zip" \
              "dist/ivpn-companion-community-firefox-${VERSION}.zip"
          else
            echo "Release $TAG does not exist — creating it with assets."
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes \
              "dist/ivpn-companion-community-chrome-${VERSION}.zip" \
              "dist/ivpn-companion-community-firefox-${VERSION}.zip"
          fi
