name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Get Version
        id: set-version
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if grep -c -E '^v[[:digit:]]{1,3}\.[[:digit:]]{1,3}\.[[:digit:]]{1,3}$' <<< ${VERSION}; then
            VERSION=$(sed 's/^.\{1\}//g' <<< ${VERSION})
          else
            echo "This tag shouldn't be built: ${VERSION}"
            exit 1
          fi
          echo "version=$(echo ${VERSION})" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.browser }}
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (${{ matrix.browser }})
        run: npm run build:${{ matrix.browser }}

      - name: Package (${{ matrix.browser }})
        run: |
          cd .output/${{ matrix.browser }}-mv3
          zip -r ../../ivpn-companion-community-${{ matrix.browser }}-${{ needs.setup.outputs.version }}.zip .

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ivpn-companion-community-${{ matrix.browser }}-${{ needs.setup.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
