name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Get Version
        id: set-version
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if grep -c -E '^v[[:digit:]]{1,3}\.[[:digit:]]{1,3}\.[[:digit:]]{1,3}$' <<< ${VERSION}; then
            VERSION=$(sed 's/^.\{1\}//g' <<< ${VERSION})
          else
            echo "This tag shouldn't be built: ${VERSION}"
            exit 1
          fi
          echo "version=$(echo ${VERSION})" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.browser }}
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v7

      - name: Install mise
        run: curl -fsSL https://mise.run | sh

      - name: Install Node
        run: mise install

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: .npm-cache
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Build (${{ matrix.browser }})
        run: mise run build-${{ matrix.browser }}

      - name: Package (${{ matrix.browser }})
        run: |
          cd .output/${{ matrix.browser }}-mv3
          zip -r ../../ivpn-companion-community-${{ matrix.browser }}-${{ needs.setup.outputs.version }}.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: extension-${{ matrix.browser }}
          path: ivpn-companion-community-${{ matrix.browser }}-${{ needs.setup.outputs.version }}.zip
          retention-days: 7

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: [setup, build]
    steps:
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.setup.outputs.version }}"
          gh release create "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "v${VERSION}" \
            --generate-notes \
            "dist/ivpn-companion-community-chrome-${VERSION}.zip#ivpn-companion-community-chrome-${VERSION}.zip" \
            "dist/ivpn-companion-community-firefox-${VERSION}.zip#ivpn-companion-community-firefox-${VERSION}.zip"
